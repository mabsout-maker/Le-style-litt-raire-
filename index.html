<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le Style Littéraire</title>

<meta name="description" content="Le Style Littéraire — Romans, poésie, analyses et culture littéraire.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050505;
  color:#f4f0e8;
  font-family:Georgia,"Times New Roman",serif;
  line-height:1.7;
}

/* NAVIGATION */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,5,5,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #292929;
  padding:12px 20px;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo-small{
  width:55px;
  height:55px;
  object-fit:contain;
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
}

nav a{
  color:#ddd;
  text-decoration:none;
  font-size:14px;
  transition:.3s;
}

nav a:hover{
  color:#c9a96a;
}

/* ACCUEIL */

.hero{
  min-height:92vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 20px;
  background:
    radial-gradient(circle at center,#211c16 0%,#0c0c0c 42%,#000 100%);
}

.hero-content{
  max-width:900px;
}

.hero-logo{
  width:180px;
  height:180px;
  object-fit:contain;
  margin-bottom:25px;
  filter:drop-shadow(0 0 30px rgba(255,255,255,.12));
}

.small-title{
  color:#c9a96a;
  letter-spacing:4px;
  font-size:12px;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(48px,9vw,95px);
  font-weight:normal;
  line-height:1;
}

.hero h1 span{
  color:#c9a96a;
  font-style:italic;
}

.hero p{
  max-width:700px;
  margin:25px auto;
  color:#aaa;
  font-size:19px;
}

.buttons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

.button{
  display:inline-block;
  padding:12px 23px;
  border:1px solid #555;
  border-radius:30px;
  color:white;
  text-decoration:none;
  transition:.3s;
}

.button:hover{
  background:#c9a96a;
  color:#000;
  border-color:#c9a96a;
  transform:translateY(-3px);
}

/* SECTIONS */

section{
  max-width:1200px;
  margin:auto;
  padding:100px 25px;
}

.section-title{
  text-align:center;
  margin-bottom:50px;
}

.section-title small{
  color:#c9a96a;
  letter-spacing:3px;
}

.section-title h2{
  font-size:48px;
  font-weight:normal;
  margin:10px 0;
}

.section-title p{
  color:#999;
}

/* RECHERCHE */

.search-box{
  max-width:700px;
  margin:0 auto 50px;
}

.search-box input{
  width:100%;
  padding:17px 22px;
  border-radius:40px;
  border:1px solid #444;
  background:#111;
  color:white;
  font-size:17px;
  outline:none;
}

.search-box input:focus{
  border-color:#c9a96a;
}

/* CARTES */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:linear-gradient(145deg,#151515,#090909);
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
  transition:.4s;
}

.card:hover{
  transform:translateY(-7px);
  border-color:#76603b;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.card-image{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#000;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.card:hover .card-image img{
  transform:scale(1.05);
}

.play{
  position:absolute;
  right:15px;
  bottom:15px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(0,0,0,.8);
  border:1px solid #aaa;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-content{
  padding:25px;
}

.tag{
  color:#c9a96a;
  font-size:11px;
  letter-spacing:2px;
}

.card h3{
  font-size:25px;
  font-weight:normal;
  margin:8px 0;
}

.card p{
  color:#999;
  font-size:15px;
}

.watch{
  display:inline-block;
  margin-top:18px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid #777;
}

.watch:hover{
  color:#c9a96a;
}

/* BLOCS */

.dark-section{
  max-width:none;
  background:#090909;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
}

.dark-inner{
  max-width:1200px;
  margin:auto;
  padding:100px 25px;
}

.category{
  border-top:1px solid #292929;
  padding:35px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.category h3{
  font-size:35px;
  font-weight:normal;
}

.category p{
  color:#888;
}

/* COMMUNAUTÉ */

.community{
  text-align:center;
  background:
    radial-gradient(circle,#1c1813,#050505 65%);
}

/* FOOTER */

footer{
  border-top:1px solid #222;
  padding:45px 20px;
  text-align:center;
  color:#777;
}

.footer-logo{
  width:65px;
  height:65px;
  object-fit:contain;
  margin-bottom:10px;
}

/* MOBILE */

@media(max-width:700px){

  .nav{
    flex-direction:column;
  }

  nav{
    gap:12px;
  }

  .hero{
    min-height:85vh;
    padding-top:60px;
  }

  .hero-logo{
    width:140px;
    height:140px;
  }

  .hero h1{
    font-size:52px;
  }

  .hero p{
    font-size:16px;
  }

  section{
    padding:70px 18px;
  }

  .section-title h2{
    font-size:36px;
  }

  .category{
    display:block;
  }

  .category h3{
    font-size:28px;
    margin-bottom:8px;
  }
}
</style>
</head>
